services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Paths are relative to this compose file (.devcontainer/), so ".." is the repo root.
      - "..:/workspace:cached"
    command: sleep infinity
    # Equivalent of the node container's runArgs (runArgs is ignored under compose).
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    networks:
      - app-network

networks:
  app-network:
    driver: bridge